<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" font-family="Inter,system-ui,-apple-system,sans-serif" aria-label="Six classes of evidence feed one layer. Each keeps what it is, where it came from and who may see it as separate facts, so an analysis over private data is a derived analysis with a private source rather than a private object."><defs><marker id="a-169857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#169857"/></marker><marker id="a-1f6fa8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1f6fa8"/></marker><marker id="a-6b4ba8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6b4ba8"/></marker><marker id="a-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a5a00"/></marker><marker id="a-a3291f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a3291f"/></marker><marker id="a-c9d6cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#c9d6cf"/></marker></defs><rect width="980" height="560" rx="14" fill="#f4f8f6"/><text x="490" y="30" text-anchor="middle" fill="#169857" font-size="11" font-weight="700" letter-spacing="1.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">EVERY SOURCE KEEPS THREE FACTS APART</text><text x="490" y="48" text-anchor="middle" fill="#71847b" font-size="11">what it IS  ·  what it came FROM  ·  who may SEE it</text><rect x="30" y="78" width="170" height="66" rx="11" fill="#efe9f7" stroke="#6b4ba8" stroke-width="1.6"/><text x="191" y="92" text-anchor="end" fill="#6b4ba8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="115.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Published literature</text><text x="115.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">source · paragraph</text><text x="115.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">verbatim quote</text><line x1="115" y1="144" x2="115" y2="196" stroke="#6b4ba8" stroke-width="1.7" marker-end="url(#a-6b4ba8)"/><rect x="216" y="78" width="170" height="66" rx="11" fill="#efe9f7" stroke="#6b4ba8" stroke-width="1.6"/><text x="377" y="92" text-anchor="end" fill="#6b4ba8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="301.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Public datasets</text><text x="301.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">accession</text><text x="301.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">checksum</text><line x1="301" y1="144" x2="301" y2="196" stroke="#6b4ba8" stroke-width="1.7" marker-end="url(#a-6b4ba8)"/><rect x="402" y="78" width="170" height="66" rx="11" fill="#f7eeda" stroke="#8a5a00" stroke-width="1.6"/><text x="563" y="92" text-anchor="end" fill="#8a5a00" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="487.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Private datasets</text><text x="487.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">checksum</text><text x="487.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">never published</text><line x1="487" y1="144" x2="487" y2="196" stroke="#8a5a00" stroke-width="1.7" marker-end="url(#a-8a5a00)"/><rect x="588" y="78" width="170" height="66" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="749" y="92" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="673.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Simulator</text><text x="673.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">labelled</text><text x="673.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">simulation</text><line x1="673" y1="144" x2="673" y2="196" stroke="#1f6fa8" stroke-width="1.7" marker-end="url(#a-1f6fa8)"/><rect x="774" y="78" width="170" height="66" rx="11" fill="#f7eeda" stroke="#8a5a00" stroke-width="1.6" stroke-dasharray="5 4"/><text x="935" y="92" text-anchor="end" fill="#8a5a00" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PLANNED</text><text x="859.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Bioreactor + FACS</text><text x="859.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">real</text><text x="859.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">measurement</text><line x1="859" y1="144" x2="859" y2="196" stroke="#8a5a00" stroke-width="1.7" marker-end="url(#a-8a5a00)"/><rect x="30" y="196" width="920" height="72" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="941" y="210" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="490.0" y="235.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Evidence layer</text><text x="490.0" y="251.0" text-anchor="middle" fill="#44574e" font-size="11">evidence_class  ·  source_evidence_class  ·  source_visibility  ·  parent_dataset_id  ·  checksums</text><rect x="30" y="306" width="448" height="96" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="469" y="320" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="254.0" y="345.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Derived analysis</text><text x="254.0" y="361.0" text-anchor="middle" fill="#44574e" font-size="11">a computed result is ALWAYS derived_analysis;</text><text x="254.0" y="374.0" text-anchor="middle" fill="#44574e" font-size="11">what it was computed from stays in</text><text x="254.0" y="387.0" text-anchor="middle" fill="#44574e" font-size="11">source_evidence_class and source_visibility</text><rect x="502" y="306" width="448" height="96" rx="11" fill="#f7e4e2" stroke="#a3291f" stroke-width="1.6"/><text x="941" y="320" text-anchor="end" fill="#a3291f" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="726.0" y="345.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">The citation firewall</text><text x="726.0" y="361.0" text-anchor="middle" fill="#44574e" font-size="11">a literature claim requires a source, a paragraph</text><text x="726.0" y="374.0" text-anchor="middle" fill="#44574e" font-size="11">and a verbatim quote. A measurement has none,</text><text x="726.0" y="387.0" text-anchor="middle" fill="#44574e" font-size="11">so no dataset can become one.</text><line x1="254" y1="268" x2="254" y2="306" stroke="#169857" stroke-width="1.7" marker-end="url(#a-169857)"/><line x1="726" y1="268" x2="726" y2="306" stroke="#a3291f" stroke-width="1.7" marker-end="url(#a-a3291f)"/><rect x="240" y="436" width="500" height="70" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="731" y="450" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="490.0" y="468.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Candidate process parameter</text><text x="490.0" y="484.0" text-anchor="middle" fill="#44574e" font-size="11">parameter · direction · arm_scope · basis · confidence</text><text x="490.0" y="497.0" text-anchor="middle" fill="#44574e" font-size="11">every contributing class still named and visible</text><line x1="254" y1="402" x2="380" y2="436" stroke="#169857" stroke-width="1.7" marker-end="url(#a-169857)"/><text x="490" y="528" text-anchor="middle" fill="#71847b" font-size="11">Classes are never collapsed into one score. A recommendation shows a row per source.</text></svg>