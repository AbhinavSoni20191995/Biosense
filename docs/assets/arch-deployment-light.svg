<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" font-family="Inter,system-ui,-apple-system,sans-serif" aria-label="The hosted BioSense service. A browser reaches only the BioSense web app, on the platform port. Inside the same container, the app talks to an Omnigent server on loopback, which launches a runner inside the container through a registered host. The runner executes the discovery_loop agents, which write their artifacts to the mounted volume at /app/runs; BioSense reads the same directory, which is why the volume must be mounted inside the runner workspace. The model key lives only in this container environment and never reaches the browser. On a laptop the same three processes are started by one script. A separate synthetic-only image holds no credentials at all."><defs><marker id="a-169857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#169857"/></marker><marker id="a-1f6fa8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1f6fa8"/></marker><marker id="a-6b4ba8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6b4ba8"/></marker><marker id="a-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a5a00"/></marker><marker id="a-a3291f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a3291f"/></marker><marker id="a-c9d6cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#c9d6cf"/></marker></defs><rect width="980" height="560" rx="14" fill="#f4f8f6"/><text x="490" y="30" text-anchor="middle" fill="#169857" font-size="11" font-weight="700" letter-spacing="1.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">WHERE IT RUNS: ONE SERVICE, THREE PROCESSES, ONE FILESYSTEM</text><rect x="30" y="54" width="200" height="66" rx="11" fill="#f7eeda" stroke="#8a5a00" stroke-width="1.6"/><text x="221" y="68" text-anchor="end" fill="#8a5a00" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="130.0" y="84.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Anyone, in a browser</text><text x="130.0" y="100.0" text-anchor="middle" fill="#44574e" font-size="11">no install · no terminal</text><text x="130.0" y="113.0" text-anchor="middle" fill="#44574e" font-size="11">no laptop of yours</text><line x1="130" y1="120" x2="130" y2="158" stroke="#8a5a00" stroke-width="1.7" marker-end="url(#a-8a5a00)"/><text x="152" y="145" text-anchor="start" fill="#71847b" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">https</text><rect x="20" y="158" width="940" height="320" rx="13" fill="#ffffff" stroke="#c9d6cf" stroke-width="1.6" stroke-dasharray="7 5"/><text x="40" y="180" text-anchor="start" fill="#71847b" font-size="10.5">one Railway service · deploy/Dockerfile.ai</text><rect x="40" y="194" width="250" height="84" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="281" y="208" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="165.0" y="233.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">BioSense web app</text><text x="165.0" y="249.0" text-anchor="middle" fill="#44574e" font-size="11">the only thing exposed</text><text x="165.0" y="262.0" text-anchor="middle" fill="#44574e" font-size="11">0.0.0.0:$PORT</text><rect x="355" y="194" width="250" height="84" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="596" y="208" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="480.0" y="233.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Omnigent server</text><text x="480.0" y="249.0" text-anchor="middle" fill="#44574e" font-size="11">127.0.0.1:6767 · loopback only</text><text x="480.0" y="262.0" text-anchor="middle" fill="#44574e" font-size="11">--agent discovery_loop at boot</text><rect x="670" y="194" width="250" height="84" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="911" y="208" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="795.0" y="233.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Runner, via a host</text><text x="795.0" y="249.0" text-anchor="middle" fill="#44574e" font-size="11">launched per session</text><text x="795.0" y="262.0" text-anchor="middle" fill="#44574e" font-size="11">workspace /app</text><line x1="290" y1="236" x2="355" y2="236" stroke="#169857" stroke-width="1.7" marker-end="url(#a-169857)"/><text x="322.5" y="229" text-anchor="middle" fill="#71847b" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">sessions</text><line x1="605" y1="236" x2="670" y2="236" stroke="#1f6fa8" stroke-width="1.7" marker-end="url(#a-1f6fa8)"/><text x="637.5" y="229" text-anchor="middle" fill="#71847b" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">launch</text><rect x="670" y="300" width="250" height="74" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="911" y="314" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="795.0" y="334.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">discovery_loop agents</text><text x="795.0" y="350.0" text-anchor="middle" fill="#44574e" font-size="11">orchestrator + 5 specialists</text><text x="795.0" y="363.0" text-anchor="middle" fill="#44574e" font-size="11">in the same image</text><line x1="795" y1="278" x2="795" y2="300" stroke="#1f6fa8" stroke-width="1.7" marker-end="url(#a-1f6fa8)"/><rect x="285" y="300" width="315" height="74" rx="11" fill="#efe9f7" stroke="#6b4ba8" stroke-width="1.6"/><text x="591" y="314" text-anchor="end" fill="#6b4ba8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="442.5" y="334.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">/app/runs  — the mounted volume</text><text x="442.5" y="350.0" text-anchor="middle" fill="#44574e" font-size="11">the runner writes · the app reads</text><text x="442.5" y="363.0" text-anchor="middle" fill="#44574e" font-size="11">no transport, because no boundary</text><line x1="668" y1="337" x2="605" y2="337" stroke="#6b4ba8" stroke-width="1.7" marker-end="url(#a-6b4ba8)"/><text x="637" y="330" text-anchor="middle" fill="#71847b" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">artifacts</text><polyline points="165,278 165,337 283,337" fill="none" stroke="#6b4ba8" stroke-width="1.7" marker-end="url(#a-6b4ba8)"/><text x="175" y="330" text-anchor="start" fill="#71847b" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ingest</text><rect x="40" y="394" width="250" height="66" rx="11" fill="#f7e4e2" stroke="#a3291f" stroke-width="1.6"/><text x="281" y="408" text-anchor="end" fill="#a3291f" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">SECRET</text><text x="165.0" y="424.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">ANTHROPIC_API_KEY</text><text x="165.0" y="440.0" text-anchor="middle" fill="#44574e" font-size="11">this container only</text><text x="165.0" y="453.0" text-anchor="middle" fill="#44574e" font-size="11">never in the image, never sent</text><rect x="355" y="394" width="250" height="66" rx="11" fill="#f7e4e2" stroke="#a3291f" stroke-width="1.6"/><text x="596" y="408" text-anchor="end" fill="#a3291f" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="480.0" y="424.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Run caps</text><text x="480.0" y="440.0" text-anchor="middle" fill="#44574e" font-size="11">per caller · per day · per run</text><text x="480.0" y="453.0" text-anchor="middle" fill="#44574e" font-size="11">a cap refuses, never downgrades</text><rect x="670" y="394" width="250" height="66" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="911" y="408" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="795.0" y="424.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">/readyz</text><text x="795.0" y="440.0" text-anchor="middle" fill="#44574e" font-size="11">reachable · agent · executor · key</text><text x="795.0" y="453.0" text-anchor="middle" fill="#44574e" font-size="11">no token, no key, no path</text><rect x="30" y="496" width="450" height="50" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="471" y="510" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="255.0" y="524.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Same three processes on a laptop</text><text x="255.0" y="540.0" text-anchor="middle" fill="#44574e" font-size="11">./scripts/start_local_ai.sh — one command, loopback only</text><rect x="500" y="496" width="450" height="50" rx="11" fill="#eef2f0" stroke="#71847b" stroke-width="1.6" stroke-dasharray="5 4"/><text x="941" y="510" text-anchor="end" fill="#71847b" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="725.0" y="524.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Synthetic-only image, unchanged</text><text x="725.0" y="540.0" text-anchor="middle" fill="#44574e" font-size="11">deploy/Dockerfile — no Omnigent, no credentials, no model call</text></svg>