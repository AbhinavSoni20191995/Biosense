<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510" role="img" font-family="Inter,system-ui,-apple-system,sans-serif" aria-label="Which analysis modalities run today and which are declared but not implemented. Phase 1 runs generic statistics, processed flow cytometry and a screening bulk expression comparison. Phase 2 adds single-cell pseudobulk and peak overlap; single cell needs the optional singlecell extra, and without it the tool is not registered at all, so a plan is refused when it is planned rather than when it runs. Raw FCS and external R tools stay declared so a manifest written today stays valid, and calling one is refused."><defs><marker id="a-169857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#169857"/></marker><marker id="a-1f6fa8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1f6fa8"/></marker><marker id="a-6b4ba8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6b4ba8"/></marker><marker id="a-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a5a00"/></marker><marker id="a-a3291f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a3291f"/></marker><marker id="a-c9d6cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#c9d6cf"/></marker></defs><rect width="980" height="510" rx="14" fill="#f4f8f6"/><text x="490" y="30" text-anchor="middle" fill="#169857" font-size="11" font-weight="700" letter-spacing="1.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">WHAT RUNS, AND WHAT IS ONLY DECLARED</text><rect x="30" y="66" width="296" height="90" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="317" y="80" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="178.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Generic statistics</text><text x="178.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">t-test · Wilcoxon · Fisher</text><text x="178.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">correlation · BH-FDR · CI</text><rect x="342" y="66" width="296" height="90" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="629" y="80" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="490.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Flow cytometry / FACS</text><text x="490.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">processed, gated population tables</text><text x="490.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">frequency · intensity · viability</text><rect x="654" y="66" width="296" height="90" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="941" y="80" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="802.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Bulk RNA</text><text x="802.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">screening comparison</text><text x="802.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">of normalised expression</text><rect x="30" y="184" width="296" height="90" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="317" y="198" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="178.0" y="226.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Single cell RNA</text><text x="178.0" y="242.0" text-anchor="middle" fill="#44574e" font-size="11">pseudobulk by sample · signatures</text><text x="178.0" y="255.0" text-anchor="middle" fill="#44574e" font-size="11">h5ad, needs [singlecell] extra</text><rect x="342" y="184" width="296" height="90" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="629" y="198" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="490.0" y="226.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">ChIP-seq / ATAC-seq</text><text x="490.0" y="242.0" text-anchor="middle" fill="#44574e" font-size="11">peak overlap · peak-to-gene</text><text x="490.0" y="255.0" text-anchor="middle" fill="#44574e" font-size="11">reads called peaks, never calls them</text><rect x="654" y="184" width="296" height="90" rx="11" fill="#eef2f0" stroke="#71847b" stroke-width="1.6" stroke-dasharray="5 4"/><text x="941" y="198" text-anchor="end" fill="#71847b" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PLANNED</text><text x="802.0" y="226.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Raw FCS / FlowSOM / UMAP</text><text x="802.0" y="242.0" text-anchor="middle" fill="#44574e" font-size="11">automated gating</text><text x="802.0" y="255.0" text-anchor="middle" fill="#44574e" font-size="11">high-dimensional cytometry</text><rect x="30" y="302" width="296" height="90" rx="11" fill="#eef2f0" stroke="#71847b" stroke-width="1.6" stroke-dasharray="5 4"/><text x="317" y="316" text-anchor="end" fill="#71847b" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">NEEDS R</text><text x="178.0" y="344.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">External R / DESeq2</text><text x="178.0" y="360.0" text-anchor="middle" fill="#44574e" font-size="11">count-level DE with shrinkage</text><text x="178.0" y="373.0" text-anchor="middle" fill="#44574e" font-size="11">needs Rscript + DESeq2</text><rect x="30" y="408" width="920" height="66" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="941" y="422" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="490.0" y="438.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">External-tool adapter</text><text x="490.0" y="454.0" text-anchor="middle" fill="#44574e" font-size="11">DESeq2 · edgeR · Scanpy · MACS — the contract and a mock ship now; the base install needs no R,</text><text x="490.0" y="467.0" text-anchor="middle" fill="#44574e" font-size="11">and every record must carry its command, versions, checksums and environment</text><rect x="30" y="492" width="10" height="10" rx="3" fill="#169857"/><text x="45" y="501" fill="#71847b" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">runs today</text><rect x="180" y="492" width="10" height="10" rx="3" fill="#71847b"/><text x="195" y="501" fill="#71847b" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">declared only</text></svg>