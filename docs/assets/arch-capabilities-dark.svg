<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" font-family="Inter,system-ui,-apple-system,sans-serif" aria-label="Which analysis modalities run today and which are declared but not implemented. Phase 1 runs generic statistics, processed flow cytometry and a screening bulk expression comparison; single cell, ChIP, ATAC, raw FCS and external R tools are declared so a manifest written today stays valid, and calling one is refused."><defs><marker id="a-2a373d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2a373d"/></marker><marker id="a-3ddc84" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#3ddc84"/></marker><marker id="a-4292c9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4292c9"/></marker><marker id="a-9478cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9478cf"/></marker><marker id="a-e0b25c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#e0b25c"/></marker><marker id="a-ef8178" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ef8178"/></marker></defs><rect width="980" height="420" rx="14" fill="#0d1317"/><text x="490" y="30" text-anchor="middle" fill="#3ddc84" font-size="11" font-weight="700" letter-spacing="1.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">WHAT RUNS, AND WHAT IS ONLY DECLARED</text><rect x="30" y="66" width="296" height="90" rx="11" fill="#112a1e" stroke="#3ddc84" stroke-width="1.6"/><text x="317" y="80" text-anchor="end" fill="#3ddc84" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="178.0" y="108.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Generic statistics</text><text x="178.0" y="124.0" text-anchor="middle" fill="#a7b8b0" font-size="11">t-test · Wilcoxon · Fisher</text><text x="178.0" y="137.0" text-anchor="middle" fill="#a7b8b0" font-size="11">correlation · BH-FDR · CI</text><rect x="342" y="66" width="296" height="90" rx="11" fill="#112a1e" stroke="#3ddc84" stroke-width="1.6"/><text x="629" y="80" text-anchor="end" fill="#3ddc84" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="490.0" y="108.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Flow cytometry / FACS</text><text x="490.0" y="124.0" text-anchor="middle" fill="#a7b8b0" font-size="11">processed, gated population tables</text><text x="490.0" y="137.0" text-anchor="middle" fill="#a7b8b0" font-size="11">frequency · intensity · viability</text><rect x="654" y="66" width="296" height="90" rx="11" fill="#112a1e" stroke="#3ddc84" stroke-width="1.6"/><text x="941" y="80" text-anchor="end" fill="#3ddc84" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="802.0" y="108.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Bulk RNA</text><text x="802.0" y="124.0" text-anchor="middle" fill="#a7b8b0" font-size="11">screening comparison</text><text x="802.0" y="137.0" text-anchor="middle" fill="#a7b8b0" font-size="11">of normalised expression</text><rect x="30" y="184" width="296" height="90" rx="11" fill="#171e22" stroke="#7c8d86" stroke-width="1.6" stroke-dasharray="5 4"/><text x="317" y="198" text-anchor="end" fill="#7c8d86" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PLANNED</text><text x="178.0" y="226.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Single cell RNA</text><text x="178.0" y="242.0" text-anchor="middle" fill="#a7b8b0" font-size="11">pseudobulk · cell state</text><text x="178.0" y="255.0" text-anchor="middle" fill="#a7b8b0" font-size="11">needs h5ad + Scanpy</text><rect x="342" y="184" width="296" height="90" rx="11" fill="#171e22" stroke="#7c8d86" stroke-width="1.6" stroke-dasharray="5 4"/><text x="629" y="198" text-anchor="end" fill="#7c8d86" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PLANNED</text><text x="490.0" y="226.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">ChIP-seq / ATAC-seq</text><text x="490.0" y="242.0" text-anchor="middle" fill="#a7b8b0" font-size="11">peak overlap · annotation</text><text x="490.0" y="255.0" text-anchor="middle" fill="#a7b8b0" font-size="11">peak-to-gene</text><rect x="654" y="184" width="296" height="90" rx="11" fill="#171e22" stroke="#7c8d86" stroke-width="1.6" stroke-dasharray="5 4"/><text x="941" y="198" text-anchor="end" fill="#7c8d86" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PLANNED</text><text x="802.0" y="226.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Raw FCS / FlowSOM / UMAP</text><text x="802.0" y="242.0" text-anchor="middle" fill="#a7b8b0" font-size="11">automated gating</text><text x="802.0" y="255.0" text-anchor="middle" fill="#a7b8b0" font-size="11">high-dimensional cytometry</text><rect x="30" y="316" width="920" height="66" rx="11" fill="#10212e" stroke="#4292c9" stroke-width="1.6"/><text x="941" y="330" text-anchor="end" fill="#4292c9" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="490.0" y="346.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">External-tool adapter</text><text x="490.0" y="362.0" text-anchor="middle" fill="#a7b8b0" font-size="11">DESeq2 · edgeR · Scanpy · MACS — the contract and a mock ship now; the base install needs no R,</text><text x="490.0" y="375.0" text-anchor="middle" fill="#a7b8b0" font-size="11">and every record must carry its command, versions, checksums and environment</text><rect x="30" y="402" width="10" height="10" rx="3" fill="#3ddc84"/><text x="45" y="411" fill="#7c8d86" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">runs today</text><rect x="180" y="402" width="10" height="10" rx="3" fill="#7c8d86"/><text x="195" y="411" fill="#7c8d86" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">declared only</text></svg>