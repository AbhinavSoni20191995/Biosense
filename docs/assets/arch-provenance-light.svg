<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 530" width="980" height="530" role="img" font-family="Inter,system-ui,-apple-system,sans-serif" aria-label="Every number carries how it was produced. A change computed from two measured values is DERIVED, because no instrument measured a difference; a comparison takes the weaker of its two inputs; and a prediction becomes checkable only where a residual compares it against a real measurement."><defs><marker id="a-169857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#169857"/></marker><marker id="a-1f6fa8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1f6fa8"/></marker><marker id="a-6b4ba8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6b4ba8"/></marker><marker id="a-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a5a00"/></marker><marker id="a-a3291f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a3291f"/></marker><marker id="a-c9d6cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#c9d6cf"/></marker></defs><rect width="980" height="530" rx="14" fill="#f4f8f6"/><text x="490" y="30" text-anchor="middle" fill="#169857" font-size="11" font-weight="700" letter-spacing="1.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">THE ESTIMATE TYPE TRAVELS WITH THE NUMBER</text><text x="490" y="48" text-anchor="middle" fill="#71847b" font-size="11">not with the card, the report or the hypothesis holding it</text><rect x="30" y="76" width="170" height="70" rx="11" fill="#f7eeda" stroke="#8a5a00" stroke-width="1.6"/><text x="191" y="90" text-anchor="end" fill="#8a5a00" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="115.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">MEASURED</text><text x="115.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">an instrument read it</text><text x="115.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">FACS, sensor, sequencer</text><rect x="216" y="76" width="170" height="70" rx="11" fill="#efe9f7" stroke="#6b4ba8" stroke-width="1.6"/><text x="377" y="90" text-anchor="end" fill="#6b4ba8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="301.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">DERIVED</text><text x="301.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">code computed it</text><text x="301.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">from measured values</text><rect x="402" y="76" width="170" height="70" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="563" y="90" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="487.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">SIMULATED</text><text x="487.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">a model produced it</text><text x="487.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">needs a modelled parameter</text><rect x="588" y="76" width="170" height="70" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="749" y="90" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="673.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">PREDICTED</text><text x="673.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">expected, not yet run</text><text x="673.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">direction may stand alone</text><rect x="774" y="76" width="170" height="70" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="935" y="90" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="859.0" y="108.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">TARGET</text><text x="859.0" y="124.0" text-anchor="middle" fill="#44574e" font-size="11">what was asked for</text><text x="859.0" y="137.0" text-anchor="middle" fill="#44574e" font-size="11">never evidence of anything</text><rect x="30" y="176" width="448" height="80" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="469" y="190" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="254.0" y="213.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Weakest link wins</text><text x="254.0" y="229.0" text-anchor="middle" fill="#44574e" font-size="11">combining a measured value with a simulated one gives SIMULATED;</text><text x="254.0" y="242.0" text-anchor="middle" fill="#44574e" font-size="11">two measured values give DERIVED, because nothing measured the difference</text><rect x="502" y="176" width="448" height="80" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="941" y="190" text-anchor="end" fill="#1f6fa8" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="726.0" y="213.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Points and percentages stay apart</text><text x="726.0" y="229.0" text-anchor="middle" fill="#44574e" font-size="11">42% to 68% is +26 percentage POINTS and +62% RELATIVE;</text><text x="726.0" y="242.0" text-anchor="middle" fill="#44574e" font-size="11">one figure standing for both is a larger-sounding claim about another quantity</text><line x1="254" y1="256" x2="254" y2="292" stroke="#c9d6cf" stroke-width="1.7" marker-end="url(#a-c9d6cf)"/><line x1="726" y1="256" x2="726" y2="292" stroke="#c9d6cf" stroke-width="1.7" marker-end="url(#a-c9d6cf)"/><rect x="30" y="292" width="920" height="70" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="941" y="306" text-anchor="end" fill="#169857" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="490.0" y="324.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Quantified hypothesis</text><text x="490.0" y="340.0" text-anchor="middle" fill="#44574e" font-size="11">one parameter, its current and candidate value, the expected effects with their own types,</text><text x="490.0" y="353.0" text-anchor="middle" fill="#44574e" font-size="11">the evidence rows with their classes, and the limitations that travel with it</text><line x1="490" y1="362" x2="490" y2="398" stroke="#8a5a00" stroke-width="1.7" marker-end="url(#a-8a5a00)"/><text x="500" y="382" text-anchor="start" fill="#71847b" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">committed BEFORE the run</text><rect x="30" y="398" width="920" height="76" rx="11" fill="#f7eeda" stroke="#8a5a00" stroke-width="1.6"/><text x="941" y="412" text-anchor="end" fill="#8a5a00" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 2</text><text x="490.0" y="433.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Prediction residual</text><text x="490.0" y="449.0" text-anchor="middle" fill="#44574e" font-size="11">measured minus predicted, hashed at commitment so a prediction edited after the result is visible.</text><text x="490.0" y="462.0" text-anchor="middle" fill="#44574e" font-size="11">A stand-in run, an unreplicated reading or an unmodelled parameter is recorded and never counted as model evidence.</text><rect x="30" y="492" width="10" height="10" rx="3" fill="#8a5a00"/><text x="45" y="501" fill="#71847b" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">an instrument</text><rect x="180" y="492" width="10" height="10" rx="3" fill="#6b4ba8"/><text x="195" y="501" fill="#71847b" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">code computed it</text><rect x="330" y="492" width="10" height="10" rx="3" fill="#1f6fa8"/><text x="345" y="501" fill="#71847b" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">a model produced it</text><rect x="480" y="492" width="10" height="10" rx="3" fill="#169857"/><text x="495" y="501" fill="#71847b" font-size="10" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">what was asked for</text></svg>