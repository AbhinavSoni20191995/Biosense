<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" font-family="Inter,system-ui,-apple-system,sans-serif" aria-label="The closed loop. A person states the objective once and authorises the campaign once, by name, with an envelope and stop conditions. After that each iteration runs without a signature: an uncertainty is raised, evidence is collected and analysed, a candidate parameter is proposed, a validated decision reaches the simulator or the bioreactor, and the instruments feed their readings straight back to the orchestrator. Every round is checked against the authorised envelope; stepping outside it stops the loop and asks again."><defs><marker id="a-2a373d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2a373d"/></marker><marker id="a-3ddc84" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#3ddc84"/></marker><marker id="a-4292c9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4292c9"/></marker><marker id="a-9478cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9478cf"/></marker><marker id="a-e0b25c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#e0b25c"/></marker><marker id="a-ef8178" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ef8178"/></marker></defs><rect width="980" height="470" rx="14" fill="#0d1317"/><text x="490" y="28" text-anchor="middle" fill="#3ddc84" font-size="11" font-weight="700" letter-spacing="1.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ONE ITERATION</text><rect x="30" y="60" width="152" height="56" rx="11" fill="#2b2210" stroke="#e0b25c" stroke-width="1.6"/><text x="106.0" y="80.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Objective</text><text x="106.0" y="96.0" text-anchor="middle" fill="#a7b8b0" font-size="11">stated once · campaign</text><text x="106.0" y="109.0" text-anchor="middle" fill="#a7b8b0" font-size="11">authorised once, by name</text><rect x="222" y="60" width="152" height="56" rx="11" fill="#112a1e" stroke="#3ddc84" stroke-width="1.6"/><text x="298.0" y="86.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Uncertainty</text><text x="298.0" y="102.0" text-anchor="middle" fill="#a7b8b0" font-size="11">hypothesis or gap</text><rect x="414" y="60" width="152" height="56" rx="11" fill="#112a1e" stroke="#3ddc84" stroke-width="1.6"/><text x="490.0" y="86.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Evidence</text><text x="490.0" y="102.0" text-anchor="middle" fill="#a7b8b0" font-size="11">literature · data</text><rect x="606" y="60" width="152" height="56" rx="11" fill="#10212e" stroke="#4292c9" stroke-width="1.6"/><text x="682.0" y="86.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Analysis</text><text x="682.0" y="102.0" text-anchor="middle" fill="#a7b8b0" font-size="11">deterministic</text><rect x="798" y="60" width="152" height="56" rx="11" fill="#10212e" stroke="#4292c9" stroke-width="1.6"/><text x="874.0" y="86.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Candidate</text><text x="874.0" y="102.0" text-anchor="middle" fill="#a7b8b0" font-size="11">a lever to test</text><line x1="182" y1="88" x2="222" y2="88" stroke="#3ddc84" stroke-width="1.7" marker-end="url(#a-3ddc84)"/><line x1="374" y1="88" x2="414" y2="88" stroke="#3ddc84" stroke-width="1.7" marker-end="url(#a-3ddc84)"/><line x1="566" y1="88" x2="606" y2="88" stroke="#4292c9" stroke-width="1.7" marker-end="url(#a-4292c9)"/><line x1="758" y1="88" x2="798" y2="88" stroke="#4292c9" stroke-width="1.7" marker-end="url(#a-4292c9)"/><rect x="606" y="170" width="344" height="56" rx="11" fill="#2d1715" stroke="#ef8178" stroke-width="1.6"/><text x="941" y="184" text-anchor="end" fill="#ef8178" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="778.0" y="201.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Decision envelope</text><text x="778.0" y="217.0" text-anchor="middle" fill="#a7b8b0" font-size="11">refuses anything the verdict does not permit</text><line x1="874" y1="116" x2="874" y2="170" stroke="#ef8178" stroke-width="1.7" marker-end="url(#a-ef8178)"/><rect x="606" y="262" width="152" height="56" rx="11" fill="#10212e" stroke="#4292c9" stroke-width="1.6"/><text x="682.0" y="288.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Simulator</text><text x="682.0" y="304.0" text-anchor="middle" fill="#a7b8b0" font-size="11">simulation</text><rect x="798" y="262" width="152" height="56" rx="11" fill="#2b2210" stroke="#e0b25c" stroke-width="1.6" stroke-dasharray="5 4"/><text x="941" y="276" text-anchor="end" fill="#e0b25c" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PLANNED</text><text x="874.0" y="293.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Bioreactor</text><text x="874.0" y="309.0" text-anchor="middle" fill="#a7b8b0" font-size="11">setpoints applied</text><line x1="682" y1="226" x2="682" y2="262" stroke="#4292c9" stroke-width="1.7" marker-end="url(#a-4292c9)"/><line x1="874" y1="226" x2="874" y2="262" stroke="#e0b25c" stroke-width="1.7" marker-end="url(#a-e0b25c)"/><polyline points="874,318 874,340 470,340 470,318" fill="none" stroke="#e0b25c" stroke-width="1.7" marker-end="url(#a-e0b25c)" stroke-dasharray="5 4"/><rect x="222" y="262" width="344" height="56" rx="11" fill="#112a1e" stroke="#3ddc84" stroke-width="1.6"/><text x="394.0" y="282.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Detectors feed back</text><text x="394.0" y="298.0" text-anchor="middle" fill="#a7b8b0" font-size="11">density · viability · pH · DO · FACS · omics</text><text x="394.0" y="311.0" text-anchor="middle" fill="#a7b8b0" font-size="11">in-line, no one retypes a number</text><line x1="606" y1="290" x2="566" y2="290" stroke="#3ddc84" stroke-width="1.7" marker-end="url(#a-3ddc84)"/><rect x="222" y="364" width="344" height="60" rx="11" fill="#10212e" stroke="#4292c9" stroke-width="1.6"/><text x="394.0" y="386.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Objective met?</text><text x="394.0" y="402.0" text-anchor="middle" fill="#a7b8b0" font-size="11">yes → finish and report</text><text x="394.0" y="415.0" text-anchor="middle" fill="#a7b8b0" font-size="11">no → name the dominant uncertainty, iterate</text><line x1="394" y1="318" x2="394" y2="364" stroke="#3ddc84" stroke-width="1.7" marker-end="url(#a-3ddc84)"/><polyline points="222,394 186,394 186,146 298,146 298,116" fill="none" stroke="#3ddc84" stroke-width="1.7" marker-end="url(#a-3ddc84)"/><text x="194" y="212" text-anchor="start" fill="#7c8d86" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">optimise against the</text><text x="194" y="225" text-anchor="start" fill="#7c8d86" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">dominant uncertainty</text><rect x="606" y="364" width="344" height="60" rx="11" fill="#112a1e" stroke="#3ddc84" stroke-width="1.6"/><text x="778.0" y="392.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Finish</text><text x="778.0" y="408.0" text-anchor="middle" fill="#a7b8b0" font-size="11">what was learned, and what was not settled</text><line x1="566" y1="394" x2="606" y2="394" stroke="#3ddc84" stroke-width="1.7" marker-end="url(#a-3ddc84)"/><text x="490" y="456" text-anchor="middle" fill="#7c8d86" font-size="11">The campaign is authorised once, by name. Every round is checked against it, and an analysis never changes a parameter by itself.</text></svg>