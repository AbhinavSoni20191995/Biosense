<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" font-family="Inter,system-ui,-apple-system,sans-serif" aria-label="The closed loop: an objective raises an uncertainty, evidence is collected and analysed, a candidate parameter is proposed, a validated decision reaches the simulator or the bioreactor, measurements return, and the loop either optimises again or finishes."><defs><marker id="a-169857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#169857"/></marker><marker id="a-1f6fa8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#1f6fa8"/></marker><marker id="a-6b4ba8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6b4ba8"/></marker><marker id="a-8a5a00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#8a5a00"/></marker><marker id="a-a3291f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#a3291f"/></marker><marker id="a-c9d6cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#c9d6cf"/></marker></defs><rect width="980" height="470" rx="14" fill="#f4f8f6"/><text x="490" y="28" text-anchor="middle" fill="#169857" font-size="11" font-weight="700" letter-spacing="1.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">ONE ITERATION</text><rect x="30" y="60" width="152" height="56" rx="11" fill="#f7eeda" stroke="#8a5a00" stroke-width="1.6"/><text x="106.0" y="86.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Objective</text><text x="106.0" y="102.0" text-anchor="middle" fill="#44574e" font-size="11">stated once</text><rect x="222" y="60" width="152" height="56" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="298.0" y="86.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Uncertainty</text><text x="298.0" y="102.0" text-anchor="middle" fill="#44574e" font-size="11">hypothesis or gap</text><rect x="414" y="60" width="152" height="56" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="490.0" y="86.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Evidence</text><text x="490.0" y="102.0" text-anchor="middle" fill="#44574e" font-size="11">literature · data</text><rect x="606" y="60" width="152" height="56" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="682.0" y="86.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Analysis</text><text x="682.0" y="102.0" text-anchor="middle" fill="#44574e" font-size="11">deterministic</text><rect x="798" y="60" width="152" height="56" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="874.0" y="86.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Candidate</text><text x="874.0" y="102.0" text-anchor="middle" fill="#44574e" font-size="11">a lever to test</text><line x1="182" y1="88" x2="222" y2="88" stroke="#169857" stroke-width="1.7" marker-end="url(#a-169857)"/><line x1="374" y1="88" x2="414" y2="88" stroke="#169857" stroke-width="1.7" marker-end="url(#a-169857)"/><line x1="566" y1="88" x2="606" y2="88" stroke="#1f6fa8" stroke-width="1.7" marker-end="url(#a-1f6fa8)"/><line x1="758" y1="88" x2="798" y2="88" stroke="#1f6fa8" stroke-width="1.7" marker-end="url(#a-1f6fa8)"/><rect x="606" y="170" width="344" height="56" rx="11" fill="#f7e4e2" stroke="#a3291f" stroke-width="1.6"/><text x="941" y="184" text-anchor="end" fill="#a3291f" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="778.0" y="201.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Decision envelope</text><text x="778.0" y="217.0" text-anchor="middle" fill="#44574e" font-size="11">refuses anything the verdict does not permit</text><line x1="874" y1="116" x2="874" y2="170" stroke="#a3291f" stroke-width="1.7" marker-end="url(#a-a3291f)"/><rect x="606" y="262" width="152" height="56" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="682.0" y="288.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Simulator</text><text x="682.0" y="304.0" text-anchor="middle" fill="#44574e" font-size="11">simulation</text><rect x="798" y="262" width="152" height="56" rx="11" fill="#f7eeda" stroke="#8a5a00" stroke-width="1.6" stroke-dasharray="5 4"/><text x="874.0" y="288.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Bioreactor</text><text x="874.0" y="304.0" text-anchor="middle" fill="#44574e" font-size="11">people run it</text><line x1="682" y1="226" x2="682" y2="262" stroke="#1f6fa8" stroke-width="1.7" marker-end="url(#a-1f6fa8)"/><line x1="874" y1="226" x2="874" y2="262" stroke="#8a5a00" stroke-width="1.7" marker-end="url(#a-8a5a00)"/><rect x="222" y="262" width="344" height="56" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="394.0" y="288.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Measurements</text><text x="394.0" y="304.0" text-anchor="middle" fill="#44574e" font-size="11">density · viability · pH · DO · FACS · omics</text><line x1="606" y1="290" x2="566" y2="290" stroke="#169857" stroke-width="1.7" marker-end="url(#a-169857)"/><rect x="222" y="364" width="344" height="60" rx="11" fill="#e2eef7" stroke="#1f6fa8" stroke-width="1.6"/><text x="394.0" y="386.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Objective met?</text><text x="394.0" y="402.0" text-anchor="middle" fill="#44574e" font-size="11">yes → finish and report</text><text x="394.0" y="415.0" text-anchor="middle" fill="#44574e" font-size="11">no → name the dominant uncertainty, iterate</text><line x1="394" y1="318" x2="394" y2="364" stroke="#169857" stroke-width="1.7" marker-end="url(#a-169857)"/><polyline points="222,394 186,394 186,146 298,146 298,116" fill="none" stroke="#169857" stroke-width="1.7" marker-end="url(#a-169857)"/><text x="194" y="212" text-anchor="start" fill="#71847b" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">optimise against the</text><text x="194" y="225" text-anchor="start" fill="#71847b" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">dominant uncertainty</text><rect x="606" y="364" width="344" height="60" rx="11" fill="#e4f2ea" stroke="#169857" stroke-width="1.6"/><text x="778.0" y="392.0" text-anchor="middle" fill="#0d1a14" font-size="13.5" font-weight="650">Finish</text><text x="778.0" y="408.0" text-anchor="middle" fill="#44574e" font-size="11">what was learned, and what was not settled</text><line x1="566" y1="394" x2="606" y2="394" stroke="#169857" stroke-width="1.7" marker-end="url(#a-169857)"/><text x="490" y="456" text-anchor="middle" fill="#71847b" font-size="11">An analysis never changes a parameter. It produces evidence; the orchestrator decides, and the envelope can refuse.</text></svg>