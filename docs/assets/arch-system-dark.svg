<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 770" width="980" height="770" role="img" font-family="Inter,system-ui,-apple-system,sans-serif" aria-label="A person states an objective. The orchestrator asks the literature and bioinformatics specialists for evidence. The bioinformatics agent discovers a public dataset or registers a private one and plans an analysis against a named uncertainty; deterministic tools then execute that plan over the data itself and return an AnalysisResult. Only those results, never the raw datasets, enter evidence synthesis, which produces candidate parameters; a validated decision reaches the simulator or the bioreactor, and measurements return to the orchestrator."><defs><marker id="a-2a373d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#2a373d"/></marker><marker id="a-3ddc84" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#3ddc84"/></marker><marker id="a-4292c9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#4292c9"/></marker><marker id="a-9478cf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#9478cf"/></marker><marker id="a-e0b25c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#e0b25c"/></marker><marker id="a-ef8178" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ef8178"/></marker></defs><rect width="980" height="770" rx="14" fill="#0d1317"/><rect x="390" y="24" width="200" height="48" rx="11" fill="#2b2210" stroke="#e0b25c" stroke-width="1.6"/><text x="581" y="38" text-anchor="end" fill="#e0b25c" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="490.0" y="51.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Person</text><text x="490.0" y="67.0" text-anchor="middle" fill="#a7b8b0" font-size="11">objective · constraints</text><rect x="330" y="104" width="320" height="62" rx="11" fill="#112a1e" stroke="#3ddc84" stroke-width="1.6"/><text x="641" y="118" text-anchor="end" fill="#3ddc84" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="490.0" y="132.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Orchestrator</text><text x="490.0" y="148.0" text-anchor="middle" fill="#a7b8b0" font-size="11">what evidence is missing to make</text><text x="490.0" y="161.0" text-anchor="middle" fill="#a7b8b0" font-size="11">the next production decision?</text><line x1="490" y1="72" x2="490" y2="104" stroke="#e0b25c" stroke-width="1.7" marker-end="url(#a-e0b25c)"/><rect x="62" y="206" width="216" height="58" rx="11" fill="#112a1e" stroke="#3ddc84" stroke-width="1.6"/><text x="269" y="220" text-anchor="end" fill="#3ddc84" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">CURRENT</text><text x="170.0" y="232.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Literature agent</text><text x="170.0" y="248.0" text-anchor="middle" fill="#a7b8b0" font-size="11">cited claims, with</text><text x="170.0" y="261.0" text-anchor="middle" fill="#a7b8b0" font-size="11">source and quote</text><rect x="318" y="206" width="344" height="58" rx="11" fill="#112a1e" stroke="#3ddc84" stroke-width="1.6"/><text x="653" y="220" text-anchor="end" fill="#3ddc84" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="490.0" y="232.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Bioinformatics agent</text><text x="490.0" y="248.0" text-anchor="middle" fill="#a7b8b0" font-size="11">annotation · dataset discovery</text><text x="490.0" y="261.0" text-anchor="middle" fill="#a7b8b0" font-size="11">analysis planning</text><line x1="330" y1="166" x2="200" y2="206" stroke="#3ddc84" stroke-width="1.7" marker-end="url(#a-3ddc84)"/><line x1="490" y1="166" x2="490" y2="206" stroke="#3ddc84" stroke-width="1.7" marker-end="url(#a-3ddc84)"/><rect x="300" y="300" width="176" height="54" rx="11" fill="#1d1730" stroke="#9478cf" stroke-width="1.6"/><text x="467" y="314" text-anchor="end" fill="#9478cf" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="388.0" y="324.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Public datasets</text><text x="388.0" y="340.0" text-anchor="middle" fill="#a7b8b0" font-size="11">GEO · ENCODE · EBI</text><text x="388.0" y="353.0" text-anchor="middle" fill="#a7b8b0" font-size="11">accession + checksum</text><rect x="504" y="300" width="176" height="54" rx="11" fill="#2b2210" stroke="#e0b25c" stroke-width="1.6"/><text x="671" y="314" text-anchor="end" fill="#e0b25c" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="592.0" y="324.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Private datasets</text><text x="592.0" y="340.0" text-anchor="middle" fill="#a7b8b0" font-size="11">never served, never</text><text x="592.0" y="353.0" text-anchor="middle" fill="#a7b8b0" font-size="11">a citation</text><rect x="708" y="206" width="216" height="58" rx="11" fill="#10212e" stroke="#4292c9" stroke-width="1.6"/><text x="915" y="220" text-anchor="end" fill="#4292c9" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="816.0" y="232.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Analysis planner</text><text x="816.0" y="248.0" text-anchor="middle" fill="#a7b8b0" font-size="11">needs a named</text><text x="816.0" y="261.0" text-anchor="middle" fill="#a7b8b0" font-size="11">uncertainty</text><line x1="388" y1="264" x2="388" y2="300" stroke="#9478cf" stroke-width="1.7" marker-end="url(#a-9478cf)"/><text x="382" y="288" text-anchor="end" fill="#7c8d86" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">fetches</text><line x1="592" y1="264" x2="592" y2="300" stroke="#e0b25c" stroke-width="1.7" marker-end="url(#a-e0b25c)"/><text x="598" y="288" text-anchor="start" fill="#7c8d86" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">registers</text><line x1="662" y1="234" x2="708" y2="234" stroke="#4292c9" stroke-width="1.7" marker-end="url(#a-4292c9)"/><text x="685.0" y="228" text-anchor="middle" fill="#7c8d86" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">plans</text><rect x="300" y="396" width="624" height="58" rx="11" fill="#10212e" stroke="#4292c9" stroke-width="1.6"/><text x="915" y="410" text-anchor="end" fill="#4292c9" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="612.0" y="422.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Deterministic analysis</text><text x="612.0" y="438.0" text-anchor="middle" fill="#a7b8b0" font-size="11">the plan, executed over the data · statistics · cytometry · bulk expression</text><text x="612.0" y="451.0" text-anchor="middle" fill="#a7b8b0" font-size="11">refuses a dataset whose metadata does not say what it is</text><line x1="388" y1="354" x2="388" y2="396" stroke="#9478cf" stroke-width="1.7" marker-end="url(#a-9478cf)"/><line x1="592" y1="354" x2="592" y2="396" stroke="#e0b25c" stroke-width="1.7" marker-end="url(#a-e0b25c)"/><line x1="816" y1="264" x2="816" y2="396" stroke="#4292c9" stroke-width="1.7" marker-end="url(#a-4292c9)"/><rect x="300" y="500" width="380" height="56" rx="11" fill="#10212e" stroke="#4292c9" stroke-width="1.6"/><text x="671" y="514" text-anchor="end" fill="#4292c9" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="490.0" y="525.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Evidence synthesis</text><text x="490.0" y="541.0" text-anchor="middle" fill="#a7b8b0" font-size="11">every source keeps its class, its visibility</text><text x="490.0" y="554.0" text-anchor="middle" fill="#a7b8b0" font-size="11">and its parent</text><line x1="490" y1="454" x2="490" y2="500" stroke="#4292c9" stroke-width="1.7" marker-end="url(#a-4292c9)"/><text x="490.0" y="478" text-anchor="middle" fill="#7c8d86" font-size="10.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">AnalysisResult — derived analysis</text><polyline points="170,264 170,528 300,528" fill="none" stroke="#3ddc84" stroke-width="1.7" marker-end="url(#a-3ddc84)"/><rect x="300" y="592" width="380" height="52" rx="11" fill="#10212e" stroke="#4292c9" stroke-width="1.6"/><text x="671" y="606" text-anchor="end" fill="#4292c9" font-size="8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-weight="700" letter-spacing="0.9">PHASE 1</text><text x="490.0" y="621.0" text-anchor="middle" fill="#e9f1ed" font-size="13.5" font-weight="650">Candidate parameters</text><text x="490.0" y="637.0" text-anchor="middle" fill="#a7b8b0" font-size="11">suggestions in the loop’s lever vocabulary</text><line x1="490" y1="556" x2="490" y2="592" stroke="#4292c9" stroke-width="1.7" marker-end="url(#a-4292c9)"/><rect x="96" y="678" width="212" height="50" rx="11" fill="#10212e" stroke="#4292c9" stroke-width="1.6"/><text x="299" y="692" text-anchor="end" fill="#4292c9" font-size="8" font-family="ui-monos