name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --locked
      - name: Literature tool tests
        run: uv run --frozen python -m unittest test_agent_tools -v
      - name: Biosimulator/outcome package tests
        run: uv run --frozen python -m unittest discover -s tests -t . -v
      - name: Offline synthetic campaign smoke run
        run: uv run --frozen python -m biosense.cli campaign --config examples/campaign.synthetic.json --out runs/ci-demo
      - name: Offline production loop smoke run (synthetic fixtures)
        run: uv run --frozen python -m biosense.production.cli demo --out runs/ci-prod-demo
      - name: Offline agent-driven loop smoke run (synthetic CAR-T fixtures)
        run: uv run --frozen python -m biosense.production.cli demo-cart --out runs/ci-cart-demo
      - name: Offline system check (a prompt's whole chain to a protocol, no model)
        run: uv run --frozen python -m biosense.production.selfcheck --runs runs
