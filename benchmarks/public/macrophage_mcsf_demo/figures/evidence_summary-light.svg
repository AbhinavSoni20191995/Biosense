="#71847b" font-size="11.5" font-weight="400">expert knowledge</text><rect x="250" y="178" width="0" height="16" rx="5" fill="#8a5a00" opacity="0.25"/><text x="258" y="190" text-anchor="start" fill="#71847b" font-size="11" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">none</text><text x="20" y="219" text-anchor="start" fill="#0d1a14" font-size="11.5" font-weight="400">derived analysis</text><rect x="250" y="208" width="230.0" height="16" rx="5" fill="#169857" opacity="0.9"/><text x="488.0" y="220" text-anchor="start" fill="#44574e" font-size="11" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">1</text><text x="20" y="249" text-anchor="start" fill="#0d1a14" font-size="11.5" font-weight="400">simulation</text><rect x="250" y="238" width="230.0" height="16" rx="5" fill="#1f6fa8" opacity="0.9"/><text x="488.0" y="250" text-anchor="start" fill="#44574e" font-size="11" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">1</text><text x="20" y="279" text-anchor="start" fill="#71847b" font-size="11.5" font-weight="400">real measurement</text><rect x="250" y="268" width="0" height="16" rx="5" fill="#169857" opacity="0.25"/><text x="258" y="280" text-anchor="start" fill="#71847b" font-size="11" font-weight="400" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">none</text><text x="20" y="316" text-anchor="start" fill="#71847b" font-size="10.5" font-weight="400">Classes are never collapsed into one score.</text></svg>