spec_version: 1
name: analyst
description: >-
  Data analyst: inspects a dataset, writes the analysis plan that fits it,
  repairs it from the tool's refusal, runs it with the deterministic tools (or,
  when they cannot express it, an agent-written script that is labelled as
  such), and interprets the result for this process with a capped confidence.
  Reports to the orchestrator. Never computes a number by hand.
instructions: prompt.md
executor:
  type: omnigent
  config:
    harness: claude-sdk
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: auto
    write_paths:
      # ./runs on a laptop, ./data/runs in the hosted image, where the volume is
      # mounted at ./data. A sandbox that refuses the run directory makes an
      # agent finish having written nothing.
      - ./runs
      - ./data/runs
      # Public GEO series fetched by `datasets fetch-geo` are registered in the
      # data cache (./data_cache on a laptop, ./data/cache in the hosted image).
      - ./data_cache
      - ./data/cache
    # Deliberately NOT ./private_data: the agent reads registered datasets
    # through the CLI, which refuses to serve or copy a private payload. An
    # agent that could write there could also move a private file somewhere
    # servable.
    read_paths:
      # On a developer laptop the repo's .venv/bin/python is a symlink into
      # uv's toolchain under the home directory, outside the project. The
      # macOS sandbox will not widen its read view to a home directory on its
      # own and refuses to launch the helper interpreter, so the toolchain is
      # named here, narrowly. Absent on the hosted image, where it is ignored.
      - ~/.local/share/uv/python
    cwd_allow_hidden:
      - .venv
    # The analyst works on datasets already registered; it needs no network.
    allow_network: false
